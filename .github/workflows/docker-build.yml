name: Docker Build e Push

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login su Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/test:${{ github.sha }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Avvia container per test
        run: |
          docker run -d --name container-di-test -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/test:${{ github.sha }}
          sleep 10
          
      - name: Verifica risposta del server
        run: |
          curl --fail http://localhost:8080 || exit 1
          echo "Il server risponde correttamente!"
          
      - name: Pulizia
        if: always()
        run: |
          docker stop container-di-test
          docker rm container-di-test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd /home/ec2-user/progetto-eccomerce
            git pull origin main
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/test:${{ github.sha }}
            docker-compose up -d